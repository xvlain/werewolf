<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0b1a">
<title>狼人杀 · 12人标准局</title>
<meta name="description" content="12人预女猎白标准局狼人杀，支持单人 AI 对战与多人联机">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 主菜单 ============ -->
  <section id="screen-menu" class="screen active">
    <div class="menu-wrap">
      <div class="logo">
        <div class="logo-moon"></div>
        <h1>狼人杀</h1>
        <p class="subtitle">12 人标准局 · 预女猎白</p>
      </div>
      <div class="menu-buttons">
        <button class="btn btn-primary" data-action="single">
          <span class="btn-icon">🎭</span>
          <span class="btn-text"><b>单人对战</b><small>你 vs 11 个 AI</small></span>
        </button>
        <button class="btn btn-ghost" data-action="lobby">
          <span class="btn-icon">🌐</span>
          <span class="btn-text"><b>多人联机</b><small>创建 / 加入房间</small></span>
        </button>
        <button class="btn btn-ghost" data-action="rules">
          <span class="btn-icon">📖</span>
          <span class="btn-text"><b>规则说明</b><small>角色技能与流程</small></span>
        </button>
      </div>
      <div class="menu-footer">
        <label class="toggle">
          <input type="checkbox" id="opt-godview">
          <span class="slider"></span>
          <span class="toggle-label">上帝观战模式（显示全场身份）</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-fast">
          <span class="slider"></span>
          <span class="toggle-label">快速模式（缩短动画等待）</span>
        </label>
      </div>
    </div>
  </section>

  <!-- ============ 联机大厅 ============ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-wrap">
      <header class="panel-head">
        <button class="btn-back" data-action="back-menu">←</button>
        <h2>多人联机</h2>
      </header>
      <div class="lobby-body">
        <div class="field">
          <label for="inp-nick">你的昵称</label>
          <input id="inp-nick" type="text" maxlength="12" placeholder="输入昵称">
        </div>
        <div class="lobby-actions">
          <button class="btn btn-primary" data-action="create-room">创建房间</button>
          <div class="join-row">
            <input id="inp-room" type="text" maxlength="6" placeholder="房间号">
            <button class="btn btn-ghost" data-action="join-room">加入</button>
          </div>
        </div>
        <div id="lobby-status" class="lobby-status"></div>
        <div id="room-panel" class="room-panel hidden">
          <div class="room-code">房间号 <b id="room-code-val">----</b></div>
          <ul id="room-players" class="room-players"></ul>
          <button class="btn btn-primary" id="btn-start-room" disabled>开始游戏（需 12 人）</button>
          <p class="hint">人数不足时可勾选「AI 补位」</p>
          <label class="toggle">
            <input type="checkbox" id="opt-aifill" checked>
            <span class="slider"></span>
            <span class="toggle-label">AI 补位至 12 人</span>
          </label>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 对局界面 ============ -->
  <section id="screen-game" class="screen">
    <!-- 顶部 HUD -->
    <header id="hud">
      <div class="hud-left">
        <span id="hud-day" class="hud-chip">第 1 天</span>
        <span id="hud-phase" class="hud-chip phase-night">夜晚</span>
      </div>
      <div class="hud-center">
        <span id="hud-alive">存活 12/12</span>
      </div>
      <div class="hud-right">
        <button id="btn-godview" class="hud-btn" title="切换上帝观战">👁</button>
        <button id="btn-speed" class="hud-btn" title="切换速度">⏩</button>
        <button id="btn-quit" class="hud-btn" title="退出对局">✕</button>
      </div>
    </header>

    <!-- 主区域 -->
    <main id="game-main">
      <!-- 座位环 -->
      <div id="table-wrap">
        <div id="table">
          <div id="table-center">
            <div id="center-phase">夜晚</div>
            <div id="center-hint">天黑请闭眼</div>
          </div>
          <div id="seats"></div>
        </div>
      </div>

      <!-- 右侧信息面板 -->
      <aside id="side-panel">
        <div class="panel" id="panel-role">
          <h3>我的身份</h3>
          <div id="my-role" class="my-role">—</div>
          <div id="my-role-desc" class="role-desc"></div>
        </div>
        <div class="panel" id="panel-intel">
          <h3>情报</h3>
          <div id="intel-checks" class="intel-block"></div>
          <div id="intel-safe" class="intel-block"></div>
          <div id="intel-wolves" class="intel-block"></div>
          <div id="intel-pattern" class="intel-block"></div>
        </div>
        <div class="panel" id="panel-log">
          <h3>发言记录</h3>
          <div id="log-stream" class="log-stream"></div>
        </div>
      </aside>
    </main>

    <!-- 底部行动区 -->
    <footer id="action-bar">
      <div id="action-title">等待中…</div>
      <div id="action-body"></div>
      <div id="action-buttons"></div>
    </footer>

    <!-- 夜晚遮罩 -->
    <div id="night-veil" class="night-veil"></div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <h2 id="result-title">—</h2>
      <p id="result-reason" class="result-reason"></p>
      <div id="result-roles" class="result-roles"></div>
      <div id="result-stats" class="result-stats"></div>
      <div class="result-buttons">
        <button class="btn btn-primary" data-action="again">再来一局</button>
        <button class="btn btn-ghost" data-action="back-menu">返回主菜单</button>
      </div>
    </div>
  </section>

  <!-- ============ 规则说明 ============ -->
  <section id="screen-rules" class="screen">
    <div class="rules-wrap">
      <header class="panel-head">
        <button class="btn-back" data-action="back-menu">←</button>
        <h2>规则说明</h2>
      </header>
      <div class="rules-body" id="rules-body"></div>
    </div>
  </section>

  <div id="toast-host"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
